<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Револьвер: VR-тир</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; height:100%; background:#0b0e14; color:#e8edf5; font-family:system-ui,-apple-system,sans-serif; overflow:hidden; overscroll-behavior:none; }
  canvas { display:block; touch-action:none; }
  #top { position:fixed; top:0; left:0; right:0; display:flex; gap:8px; align-items:flex-start; justify-content:space-between; padding:10px 12px; pointer-events:none; }
  #score { font-weight:700; font-size:15px; line-height:1.35; text-shadow:0 1px 3px #000; white-space:pre; }
  #status { font-size:12px; opacity:.85; margin-top:4px; max-width:62vw; text-shadow:0 1px 3px #000; }
  #vrbtn { pointer-events:auto; background:#1f7a3e; color:#fff; border:0; border-radius:10px; padding:11px 14px; font-size:15px; font-weight:700; display:none; }
  #cross { position:fixed; left:50%; top:50%; width:8px; height:8px; margin:-4px 0 0 -4px; border:2px solid #ffffffbb; border-radius:50%; pointer-events:none; }
  #pad { position:fixed; left:0; right:0; bottom:0; padding:10px 10px 14px; display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  #pad button { padding:15px 2px; font-size:14px; font-weight:700; border-radius:12px; border:1px solid #ffffff30; background:#1a2130d9; color:#e8edf5; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  #pad button:active, #pad button.on { background:#34476b; }
  #pad button.fire { grid-column:span 2; background:#7a1f1fe0; }
  body.vr #pad, body.vr #cross, body.vr #top { display:none; }
</style>
</head>
<body>
<div id="top">
  <div><div id="score"></div><div id="status"></div></div>
  <button id="vrbtn">Войти в VR</button>
</div>
<div id="cross"></div>
<div id="pad">
  <button data-act="draw">Достать</button>
  <button data-act="cyl">Барабан</button>
  <button data-act="spin">Крутить</button>
  <button data-act="dump">Вытряхнуть</button>
  <button data-act="load">Патрон</button>
  <button data-act="cock">Взвести (подержи)</button>
  <button data-act="fire" class="fire">ОГОНЬ</button>
</div>

<script>setTimeout(function () { if (!window.__booted) document.getElementById("status").textContent = "Не загрузилась библиотека Three.js: нужен интернет (cdn.jsdelivr.net)"; }, 7000);</script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
// =====================================================================
//  Револьвер: VR-тир (WebXR + Three.js). Один файл, без внешних ассетов.
//  Шлем: Quest Browser, кнопка «Войти в VR». Телефон: режим с кнопками.
//  Адрес с ?left=1 — для левши (кобура слева).
//  Единицы: метры. Игрок стоит у стола, мишени на 7 / 15 / 25 м (по -Z).
// =====================================================================
import * as THREE from 'three';

const params = new URLSearchParams(location.search);
const LEFTY = params.has('left');
const MAIN = LEFTY ? 'left' : 'right';        // рука с револьвером (доминантная)
const SUPPORT = LEFTY ? 'right' : 'left';     // опорная рука
const D2R = Math.PI / 180;
const { clamp, lerp } = THREE.MathUtils;
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const UPV = V3(0, 1, 0);
const $ = (id) => document.getElementById(id);

// ---------- Звук: всё синтезируется WebAudio, файлов нет ----------
const sfx = (() => {
  let ctx = null, out = null, conv = null, noiseBuf = null;
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    out = ctx.createGain(); out.gain.value = 0.9; out.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // эхо тира: шум с затуханием, 1.6 с
    const len = Math.floor(ctx.sampleRate * 1.6);
    const ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const ch = ir.getChannelData(c);
      for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    }
    conv = ctx.createConvolver(); conv.buffer = ir;
    const wet = ctx.createGain(); wet.gain.value = 0.32;
    conv.connect(wet); wet.connect(out);
  }
  function env(g, t, vol, atk, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function tone(f0, f1, dur, vol, type = 'sine', rev = false) {
    if (!ctx) return;
    const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    env(g, t, vol, 0.002, dur);
    o.connect(g); g.connect(out); if (rev) g.connect(conv);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, ftype, freq, q, rev = false) {
    if (!ctx) return;
    const t = ctx.currentTime, s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; s.playbackRate.value = 0.8 + Math.random() * 0.4;
    f.type = ftype; f.frequency.value = freq; f.Q.value = q;
    env(g, t, vol, 0.001, dur);
    s.connect(f); f.connect(g); g.connect(out); if (rev) g.connect(conv);
    s.start(t, Math.random() * 0.5, dur + 0.05);
  }
  return {
    init,
    notch(i) { tone(1700 + i * 260, 900, 0.035, 0.22, 'square'); noise(0.02, 0.12, 'highpass', 4000, 1); },
    lock() { tone(260, 120, 0.08, 0.4, 'triangle'); noise(0.03, 0.3, 'bandpass', 2500, 2); },
    hammerDown() { tone(300, 140, 0.05, 0.25, 'triangle'); },
    dry() { tone(1500, 800, 0.03, 0.3, 'square'); noise(0.02, 0.3, 'highpass', 3000, 1); },
    dead() { tone(1400, 900, 0.02, 0.1, 'square'); },
    shot() {
      noise(0.4, 1.0, 'lowpass', 2600, 0.7, true);
      noise(0.05, 0.9, 'highpass', 2000, 0.7, true);
      tone(170, 45, 0.3, 0.9, 'sine', true);
    },
    latch() { tone(950, 600, 0.05, 0.3, 'square'); },
    tick() { tone(1200, 700, 0.03, 0.22, 'square'); },
    seat() { tone(700, 500, 0.04, 0.3, 'triangle'); noise(0.03, 0.2, 'bandpass', 3000, 2); },
    close() { tone(420, 200, 0.09, 0.4, 'triangle'); noise(0.04, 0.3, 'bandpass', 2200, 2); },
    eject() { tone(520, 300, 0.07, 0.25, 'triangle'); noise(0.05, 0.2, 'highpass', 2500, 1); },
    casing(v = 1) {
      tone(3200 + Math.random() * 900, 2900, 0.14, 0.14 * v, 'sine');
      tone(4800 + Math.random() * 900, 4300, 0.09, 0.08 * v, 'sine');
    },
    ping() { tone(1300, 1250, 0.55, 0.4, 'sine', true); tone(2750, 2700, 0.35, 0.2, 'sine', true); },
    thud() { noise(0.06, 0.5, 'lowpass', 900, 1); tone(180, 90, 0.08, 0.35); },
    rub(v) { noise(0.12, 0.12 * clamp(v, 0, 1), 'bandpass', 1100, 0.8); },
  };
})();

// ---------- Рендер и сцена ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
try { renderer.xr.setFoveation(0.6); } catch (e) { /* не везде есть */ }
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e14);
scene.fog = new THREE.Fog(0x0b0e14, 10, 48);
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.02, 90);
const dolly = new THREE.Group();            // «тележка» игрока: двигаем её, а не камеру
scene.add(dolly);
dolly.add(camera);
camera.position.set(0, 1.6, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.75));
scene.add(new THREE.HemisphereLight(0xcfd8e6, 0x20242c, 0.9));
const lamp = new THREE.PointLight(0xffe2b0, 9, 8, 2); lamp.position.set(0, 2.7, -0.4); scene.add(lamp);
for (const z of [-8, -18, -28]) { const l = new THREE.PointLight(0xdfe8ff, 22, 16, 2); l.position.set(0, 3.1, z); scene.add(l); }

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
function radialTex(inner, outer) {
  return canvasTex(64, 64, (g) => {
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, inner); gr.addColorStop(1, outer);
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  });
}
const box = (w, h, d, color, x, y, z, extra = {}) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, roughness: 0.9, metalness: 0.05, ...extra }));
  m.position.set(x, y, z); scene.add(m); return m;
};

// ---------- Тир: комната, стойка, стол ----------
const room = new THREE.Mesh(new THREE.BoxGeometry(7, 3.4, 40),
  new THREE.MeshStandardMaterial({ color: 0x343a45, roughness: 1, side: THREE.BackSide }));
room.position.set(0, 1.7, -17); scene.add(room);

const floorTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#3b4049'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1400; i++) { g.fillStyle = `rgba(${Math.random() < 0.5 ? 255 : 0},${Math.random() < 0.5 ? 255 : 0},${Math.random() < 0.5 ? 255 : 0},0.03)`; g.fillRect(Math.random() * w, Math.random() * h, 3, 3); }
  g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 2; g.strokeRect(0, 0, w, h);
});
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(4, 22);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(7, 40), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0.001, -17); scene.add(floor);

for (const z of [-3, -9, -15, -21, -27, -33]) {          // потолочные лампы
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.05, 0.28), new THREE.MeshBasicMaterial({ color: 0xfff3d6 }));
  m.position.set(0, 3.37, z); scene.add(m);
}
const TABLE = { x0: -0.6, x1: 0.6, z0: -0.78, z1: -0.28, top: 0.9 };    // стол с патронами
box(1.2, 0.9, 0.5, 0x5b4630, 0, 0.45, -0.53);
box(1.25, 0.03, 0.55, 0x6d543a, 0, 0.905, -0.53);
for (const sx of [-1.3, 1.3]) box(0.05, 1.1, 1.7, 0x2a2f38, sx, 0.55, -0.35);   // перегородки кабинки
box(7, 1.6, 0.4, 0x1f2329, 0, 0.8, -35.7);                                       // пулеулавливатель

// метки дистанции на полу
for (const d of [7, 15, 25]) {
  const t = canvasTex(256, 96, (g, w, h) => {
    g.fillStyle = 'rgba(0,0,0,0)'; g.clearRect(0, 0, w, h);
    g.fillStyle = '#f2c14e'; g.font = 'bold 64px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(d + ' м', w / 2, h / 2);
  });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.52), new THREE.MeshBasicMaterial({ map: t, transparent: true }));
  m.rotation.x = -Math.PI / 2; m.position.set(2.6, 0.01, -d + 1.2); scene.add(m);
}

// ---------- Мишени ----------
const targets = [];
const paperTex = canvasTex(256, 300, (g, w, h) => {
  g.fillStyle = '#e8e1cd'; g.fillRect(0, 0, w, h);
  for (let r = 10; r >= 1; r--) {                         // 10 колец по 12 px, центр (128, 150)
    g.beginPath(); g.arc(128, 150, r * 12, 0, Math.PI * 2);
    g.fillStyle = r <= 6 ? '#16181c' : '#e8e1cd'; g.fill();
    g.strokeStyle = r <= 6 ? '#8d8f94' : '#16181c'; g.lineWidth = 2; g.stroke();
  }
});
const pole = (x, z, h) => box(0.04, h, 0.04, 0x4a4f58, x, h / 2, z - 0.05);

function addPaper(x, z, scale) {
  const W = 0.5 * scale, H = W * 300 / 256, cy = 1.35;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(W, H), new THREE.MeshStandardMaterial({ map: paperTex, roughness: 1 }));
  m.position.set(x, cy, z); scene.add(m); pole(x, z, cy - H / 2);
  targets.push({ kind: 'paper', x, z, cy, W, H, ringW: 12 * (W / 256), dist: -z });
}
function addSteel(x, z, scale) {
  const r = 0.15 * scale, y0 = 0.75;
  const hinge = new THREE.Group(); hinge.position.set(x, y0, z); scene.add(hinge);
  const g = new THREE.CylinderGeometry(r, r, 0.025, 28); g.rotateX(Math.PI / 2);
  const plate = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0xb23a2e, roughness: 0.5, metalness: 0.3 }));
  plate.position.set(0, r + 0.02, 0); hinge.add(plate); pole(x, z, y0);
  targets.push({ kind: 'steel', x, z, cy: y0 + r + 0.02, r, ringW: r / 10, dist: -z, hinge, y0, t: -1 });
}
addPaper(-1.0, -7, 1.0); addSteel(1.0, -7, 1.0);
addPaper(0.0, -15, 1.6); addSteel(-1.0, -25, 2.4); addPaper(1.0, -25, 2.6);

// попадание по мишени: возвращает очки или null
function testTarget(t, hx, hy) {
  const dx = hx - t.x, dy = hy - t.cy;
  let r;
  if (t.kind === 'paper') {
    if (Math.abs(dx) > t.W / 2 || Math.abs(dy) > t.H / 2) return null;
    r = Math.hypot(dx, dy);
  } else {
    if (t.t >= 0) return null;                               // уже лежит
    r = Math.hypot(dx, dy);
    if (r > t.r) return null;
  }
  const ring = Math.max(0, 10 - Math.floor(r / t.ringW));
  return Math.round(ring * (1 + t.dist / 25));              // очки × (1 + дистанция/25)
}
function updateTargets(dt) {
  for (const t of targets) {
    if (t.kind !== 'steel' || t.t < 0) continue;
    t.t += dt;
    const a = t.t < 0.15 ? t.t / 0.15 : t.t < 3 ? 1 : Math.max(0, 1 - (t.t - 3) / 0.3);
    t.hinge.rotation.x = -80 * D2R * (a * a * (3 - 2 * a));
    if (t.t > 3.3) { t.t = -1; t.hinge.rotation.x = 0; }
  }
}

// ---------- Дырки, трассер, вспышка, дым ----------
const holes = []; let holeI = 0;
for (let i = 0; i < 64; i++) {
  const m = new THREE.Mesh(new THREE.CircleGeometry(0.012, 10), new THREE.MeshBasicMaterial({ color: 0x050505 }));
  m.visible = false; scene.add(m); holes.push(m);
}
function addHole(x, y, z) { const m = holes[holeI++ % holes.length]; m.position.set(x, y, z + 0.003); m.visible = true; }

const tracers = []; let tracerI = 0;
for (let i = 0; i < 6; i++) {
  const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([V3(), V3(0, 0, -1)]),
    new THREE.LineBasicMaterial({ color: 0xffe9b0, transparent: true, opacity: 0 }));
  l.frustumCulled = false; scene.add(l); tracers.push({ l, life: 0 });
}
function addTracer(a, b) {
  const t = tracers[tracerI++ % tracers.length], p = t.l.geometry.attributes.position;
  p.setXYZ(0, a.x, a.y, a.z); p.setXYZ(1, b.x, b.y, b.z); p.needsUpdate = true; t.life = 0.12;
}

const flashLight = new THREE.PointLight(0xffc070, 0, 4, 2); scene.add(flashLight);
const flashSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: radialTex('rgba(255,240,200,1)', 'rgba(255,140,40,0)'), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
flashSprite.scale.set(0.16, 0.16, 0.16); flashSprite.visible = false; scene.add(flashSprite);
let flashT = 0;
function flashAt(p) { flashLight.position.copy(p); flashLight.intensity = 14; flashSprite.position.copy(p); flashSprite.visible = true; flashT = 0.04; }

const smokeTex = radialTex('rgba(210,210,215,0.55)', 'rgba(210,210,215,0)');
const smoke = [];
for (let i = 0; i < 16; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: smokeTex, transparent: true, depthWrite: false, opacity: 0 }));
  s.visible = false; scene.add(s); smoke.push({ s, life: 0, max: 1, v: V3() });
}
let smokeI = 0;
function puff(p, life, up = 0.18) {
  const o = smoke[smokeI++ % smoke.length];
  o.s.position.copy(p); o.s.visible = true; o.life = o.max = life;
  o.v.set((Math.random() - 0.5) * 0.12, up, (Math.random() - 0.5) * 0.12 - 0.05);
}
function updateFx(dt) {
  if (flashT > 0) { flashT -= dt; if (flashT <= 0) { flashLight.intensity = 0; flashSprite.visible = false; } }
  for (const t of tracers) { if (t.life > 0) { t.life -= dt; t.l.material.opacity = Math.max(0, t.life / 0.12) * 0.8; } }
  for (const o of smoke) {
    if (o.life <= 0) continue;
    o.life -= dt;
    if (o.life <= 0) { o.s.visible = false; continue; }
    const k = 1 - o.life / o.max;
    o.s.position.addScaledVector(o.v, dt);
    o.s.scale.setScalar(0.06 + 0.3 * k);
    o.s.material.opacity = 0.9 * (1 - k) * Math.min(1, k * 8);
  }
}

// ---------- Табло ----------
const score = { total: 0, shots: 0, hits: 0 };
const boardCanvas = document.createElement('canvas'); boardCanvas.width = 512; boardCanvas.height = 256;
const boardTex = new THREE.CanvasTexture(boardCanvas); boardTex.colorSpace = THREE.SRGBColorSpace;
const board = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 0.65), new THREE.MeshBasicMaterial({ map: boardTex }));
board.position.set(-1.45, 1.7, -1.15); board.rotation.y = 0.9; scene.add(board);
function updateBoard() {
  const acc = score.shots ? Math.round(100 * score.hits / score.shots) : 0;
  const g = boardCanvas.getContext('2d');
  g.fillStyle = '#0d1118'; g.fillRect(0, 0, 512, 256);
  g.strokeStyle = '#f2c14e'; g.lineWidth = 6; g.strokeRect(4, 4, 504, 248);
  g.fillStyle = '#f2c14e'; g.font = 'bold 40px sans-serif'; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText('ОЧКИ  ' + score.total, 30, 62);
  g.fillStyle = '#dfe6f2'; g.font = 'bold 34px sans-serif';
  g.fillText('ВЫСТРЕЛЫ  ' + score.shots, 30, 128);
  g.fillText('ТОЧНОСТЬ  ' + acc + '%', 30, 190);
  boardTex.needsUpdate = true;
  $('score').textContent = 'ОЧКИ ' + score.total + '   ВЫСТРЕЛЫ ' + score.shots + '   ТОЧНОСТЬ ' + acc + '%';
}
updateBoard();

// =====================================================================
//  Патроны (каждый — отдельный физический объект), курок
// =====================================================================
const now = () => performance.now() / 1000;
const matSteel = new THREE.MeshStandardMaterial({ color: 0x4a505b, roughness: 0.45, metalness: 0.4 });
const matDark = new THREE.MeshStandardMaterial({ color: 0x1b1d22, roughness: 0.6, metalness: 0.3 });
const matWood = new THREE.MeshStandardMaterial({ color: 0x7a4a28, roughness: 0.7 });
const matBrass = new THREE.MeshStandardMaterial({ color: 0xd2a94e, roughness: 0.35, metalness: 0.45 });
const matLead = new THREE.MeshStandardMaterial({ color: 0xa3a9b3, roughness: 0.5, metalness: 0.25 });

// Патрон: начало в центре донца, тело уходит по -Z (как ствол). Длина 39 мм, радиус 5.5 мм.
const cartGeo = (() => {
  const mk = (r0, r1, len, z) => { const g = new THREE.CylinderGeometry(r0, r1, len, 12); g.rotateX(-Math.PI / 2); g.translate(0, 0, z); return g; };
  return { c: mk(0.0055, 0.0057, 0.030, -0.015), b: mk(0.0045, 0.0045, 0.012, -0.033), r: mk(0.0065, 0.0065, 0.0015, -0.00075) };
})();
const carts = [];
const TABLE_REST = 0.0065;                                 // радиус патрона: центр над поверхностью

function makeCart(state = 'live') {
  const g = new THREE.Group();
  const bullet = new THREE.Mesh(cartGeo.b, matLead);
  g.add(new THREE.Mesh(cartGeo.c, matBrass), new THREE.Mesh(cartGeo.r, matBrass), bullet);
  const cart = { mesh: g, bullet, state, where: 'free', v: V3(), rest: false, hand: null, ch: -1, home: null, idle: 0, floorT: 0, age: 0, lastSnd: -1, slide: null };
  bullet.visible = state === 'live';
  scene.add(g); carts.push(cart);
  return cart;
}
function fireCart(cart) { cart.state = 'spent'; cart.bullet.visible = false; }   // гильза остаётся в камере

function surfaceY(p) {

  _fd.set(0, 0, -1).applyQuaternion(mesh.quaternion); _fd.y = 0;

const _cl = V3();

function updateCarts(dt) {
  for (const c of carts.slice()) {
    c.age += dt;
    const m = c.mesh;
    if (c.where === 'chamber') {
      if (c.slide) {                                       // 60 мс до идеальной позы в камере
        c.slide.t += dt / 0.06;
        const k = Math.min(1, c.slide.t);
        m.position.lerpVectors(c.slide.p0, chamberLocal(c.ch, _cl), k);
        m.quaternion.slerpQuaternions(c.slide.q0, _fq.identity(), k);
        if (k >= 1) c.slide = null;

    if (c.where !== 'free') continue;
    if (!c.rest) {
      c.v.y -= 9.81 * dt;
      m.position.addScaledVector(c.v, dt);
      const sy = surfaceY(m.position) + TABLE_REST;
      if (m.position.y <= sy && c.v.y <= 0) {
        m.position.y = sy;
        const impact = Math.abs(c.v.y) + Math.hypot(c.v.x, c.v.z);
        if (impact > 0.5 && c.age - c.lastSnd > 0.05) { sfx.casing(clamp(impact / 3, 0.2, 1)); c.lastSnd = c.age; }
        if (Math.abs(c.v.y) > 0.8) { c.v.y *= -0.25; c.v.x *= 0.6; c.v.z *= 0.6; }
        else { c.rest = true; c.v.set(0, 0, 0); c.idle = 0; }

    if (c.state === 'live' && c.home && m.position.y < 0.2) {                            // упал на пол: вернуть на стол через 10 с
      c.floorT += dt;

function spawnCarts(n) {                                   // высыпать патроны на стол: 55×30 см
  let placed = 0, tries = 0;
  while (placed < n && tries++ < n * 14) {
    const x = lerp(TABLE.x0 + 0.06, TABLE.x1 - 0.06, Math.random()), z = lerp(TABLE.z0 + 0.05, TABLE.z1 - 0.05, Math.random());
    let busy = false;
    for (const o of carts) if (o.where === 'free' && Math.hypot(o.mesh.position.x - x, o.mesh.position.z - z) < 0.06) { busy = true; break; }
    if (busy) continue;
    const c = makeCart('live');
    c.mesh.position.set(x, TABLE.top + TABLE_REST + 0.02, z);
    c.mesh.rotation.y = Math.random() * Math.PI * 2;
    c.home = V3(x, TABLE.top + TABLE_REST + 0.02, z);
    placed++;

}

// ---------- Курок: 0° покой, 49° сухарь цепляет, 52° боевой взвод ----------
class Hammer {
  constructor() {
    this.angle = 0; this.cocked = false; this.decocking = false; this.owner = null; this.locked = false;
    this.dragSpeed = 900; this.returnSpeed = 600; this.lastNotch = 0; this.indexed = false;
    this.onNotch = () => {}; this.onIndex = () => {}; this.onCocked = () => {}; this.onSlipped = () => {};
  }
  get down() { return !this.cocked && this.angle < 1; }
  tryHold(o) { if (this.locked) return false; if (this.owner === null || this.owner === o) { this.owner = o; return true; } return false; }
  release(o) { if (this.owner !== o) return; this.owner = null; this.decocking = false; }
  beginDecock() { if (this.owner !== null && this.cocked) { this.cocked = false; this.decocking = true; } }
  resetIndex() { this.indexed = false; this.lastNotch = 0; }
  drag(o, target, dt) {
    if (this.owner !== o || this.locked) return;
    if (this.cocked && !this.decocking) return;                       // уже на боевом взводе
    const step = this.dragSpeed * dt;
    this.angle += clamp(clamp(target, 0, 52) - this.angle, -step, step);
    let just = false;
    if (!this.decocking && this.angle >= 49) { this.cocked = true; this.angle = 52; just = true; }
    const n = Math.floor(this.angle / 13);                            // 4 щелчка трещотки
    if (n !== this.lastNotch) { this.lastNotch = n; if (n > 0) this.onNotch(n); }
    if (this.decocking) {                                             // спуск курка рукой: идёт вниз без выстрела
      if (this.angle <= 0.5) { this.angle = 0; this.decocking = false; this.resetIndex(); this.onSlipped(); }
      return;
    }
    if (this.angle < 5) this.indexed = false;
    if (!this.indexed && this.angle >= 36) { this.indexed = true; this.onIndex(); }   // барабан +60° на ~70% хода
    if (just) this.onCocked();
  }
  fall() {                                                            // сухарь сорван
    if (!this.cocked) return false;
    this.cocked = false; this.decocking = false; this.angle = 0; this.resetIndex();
    return true;
  }
  update(dt) {                                                        // не дожали до 49°: пружина без выстрела
    if (this.owner !== null || this.cocked || this.angle <= 0) return;
    this.angle = Math.max(0, this.angle - this.returnSpeed * dt);
    this.lastNotch = Math.floor(this.angle / 13);
    if (this.angle <= 0) { this.resetIndex(); this.onSlipped(); }
  }
}

// =====================================================================
//  Револьвер: модель и механика. Ствол смотрит по -Z, начало координат у верха рукояти.
//  Откидной барабан на 6 камер (журавль влево), single action: без взвода выстрела нет.
// =====================================================================
const gun = (() => {
  const root = new THREE.Group(); scene.add(root);
  const recoil = new THREE.Group(); root.add(recoil);            // отдача двигает только визуал
  const add = (parent, geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m; };
  const cyl = (parent, r, len, mat, x, y, z) => { const g = new THREE.CylinderGeometry(r, r, len, 20); g.rotateX(-Math.PI / 2); return add(parent, g, mat, x, y, z); };

  add(recoil, new THREE.BoxGeometry(0.026, 0.05, 0.09), matSteel, 0, 0.018, 0.025);          // рамка
  cyl(recoil, 0.011, 0.13, matSteel, 0, 0.032, -0.125);                                      // ствол
  add(recoil, new THREE.BoxGeometry(0.016, 0.014, 0.1), matSteel, 0, 0.014, -0.11);          // подствольный выступ
  add(recoil, new THREE.BoxGeometry(0.004, 0.008, 0.01), matDark, 0, 0.046, -0.185);         // мушка
  add(recoil, new THREE.BoxGeometry(0.03, 0.1, 0.04), matWood, 0, -0.055, 0.04).rotation.x = -0.35;   // рукоять

  const swing = new THREE.Group(); swing.position.set(0, -0.012, 0); recoil.add(swing);      // журавль: ось ‖ стволу, под барабаном
  const rotor = new THREE.Group(); rotor.position.set(0, 0.03, 0); swing.add(rotor);          // барабан крутится вокруг оси Z
  cyl(rotor, 0.0235, 0.04, matSteel, 0, 0, -0.04);
  for (let i = 0; i < 6; i++) {                                                               // 6 камер на заднем срезе
    const h = add(rotor, new THREE.CircleGeometry(0.0058, 12), matDark, 0, 0, -0.0199);
    chamberLocal(i, h.position); h.position.z = -0.0199;
  }
  cyl(swing, 0.004, 0.012, matDark, 0, 0.024, -0.118);                                        // головка штока экстрактора

  const hammerPivot = new THREE.Group(); hammerPivot.position.set(0, 0.04, 0.062); recoil.add(hammerPivot);
  add(hammerPivot, new THREE.BoxGeometry(0.008, 0.03, 0.012), matDark, 0, 0.012, 0);
  add(hammerPivot, new THREE.BoxGeometry(0.01, 0.006, 0.018), matDark, 0, 0.026, 0.006);     // шпора
  const trigGroup = new THREE.Group(); trigGroup.position.set(0, 0, 0.03); recoil.add(trigGroup);
  add(trigGroup, new THREE.BoxGeometry(0.006, 0.022, 0.008), matDark, 0, -0.011, 0);
  const latchMesh = add(recoil, new THREE.BoxGeometry(0.004, 0.01, 0.014), matDark, -0.014, 0.02, 0.02);   // защёлка барабана
  const muzzle = new THREE.Object3D(); muzzle.position.set(0, 0.032, -0.19); recoil.add(muzzle);

    holder: null, holstered: true, supportHand: null, hamHand: null, cylHand: null,   // 'left' | 'right' | 'phone' | null
    vel: V3(), rest: false, idle: 0, prevPos: V3(), prevVel: V3(), prevInit: false, shake: 0, nextDrop: 0,
    buzz: () => {},
  };

})();

const _gp = V3(), _gp2 = V3(), _gp3 = V3(), _ga = V3();
const isOpen = () => gun.swingAngle > 4;
const currentChamber = () => (((Math.round(-gun.rotorBase / 60)) % 6) + 6) % 6;     // камера напротив ствола и бойка

function chamberMouthWorld(i, out) { return gun.rotor.localToWorld(chamberLocal(i, out)); }
function chamberAxisWorld(out) { return out.set(0, 0, -1).transformDirection(gun.rotor.matrixWorld); }   // вглубь камеры

// ---------- События курка ----------
gun.hammer.onNotch = (n) => { sfx.notch(n); gun.buzz(gun.hamHand || gun.holder, 0.15, 12); };
gun.hammer.onIndex = () => advance();
gun.hammer.onCocked = () => { sfx.lock(); gun.buzz(gun.hamHand || gun.holder, 0.3, 20); };
gun.hammer.onSlipped = () => sfx.hammerDown();

function advance() {                                       // барабан +60° за 40 мс
  if (gun.latched && !isOpen() && !gun.rotorAnim) gun.rotorAnim = { from: gun.rotorBase, to: gun.rotorBase + 60, t: 0 };
}

// ---------- Спуск ----------
function trigInput(v, canFire) {
  const travel = canFire ? v : Math.min(v, 0.2);                 // без взвода спуск «мёртвый»
  gun.trigGroup.rotation.x = -travel * 14 * D2R;
  if (gun.trigArmed && v >= 0.8) {
    gun.trigArmed = false;
    if (canFire) onSearBreak(); else { sfx.dead(); gun.buzz(gun.holder, 0.1, 10); }
  } else if (!gun.trigArmed && v <= 0.4) gun.trigArmed = true;   // чтобы стрелять снова, спуск надо отпустить
}
function onSearBreak() {
  gun.buzz(gun.holder, 0.25, 15);
  if (gun.hammer.owner !== null) { gun.hammer.beginDecock(); return; }   // рука на курке: плавный спуск вниз, без выстрела
  if (gun.hammer.fall()) gun.strikeT = 0.012;                            // курок падает ~12 мс
}
function strike() {
  const c = gun.chambers[currentChamber()];

  else { sfx.dry(); gun.buzz(gun.holder, 0.35, 20); }                    // пустая камера или стреляная гильза
}

// ---------- Выстрел ----------
function shoot() {
  gun.root.updateMatrixWorld(true);
  const p = V3(), d = V3();
  gun.muzzle.getWorldPosition(p);
  if (gun.holder === 'phone') phoneAim(p, d); else d.set(0, 0, -1).transformDirection(gun.muzzle.matrixWorld);
  const end = traceBullet(p, d);
  const seg = end.clone().sub(p); if (seg.length() > 14) seg.setLength(14);
  addTracer(p, p.clone().add(seg));
  flashAt(p);
  for (let i = 0; i < 4; i++) puff(p, 1.8);                              // дым у дула 1.8 с
  gun.rotor.getWorldPosition(_gp); puff(_gp, 0.7, 0.1);                  // дымок из зазора барабана 0.7 с
  sfx.shot();
  score.shots++; updateBoard();
  gun.recoilT = 0; gun.recoilK = gun.supportHand ? 0.55 : 1;
  gun.buzz(gun.holder, 1, 45); gun.buzz(gun.supportHand, 0.6, 45);
  setTimeout(() => { gun.buzz(gun.holder, 0.35, 90); gun.buzz(gun.supportHand, 0.2, 90); }, 45);   // хвост отдачи
}

// Псевдобаллистика: 300 м/с, шаг 1/300 с, гравитация (≈14 см падения на 50 м)
function traceBullet(origin, dir) {
  const p = origin.clone(), v = dir.clone().normalize().multiplyScalar(300), dt = 1 / 300, p0 = V3();
  for (let i = 0; i < 110; i++) {
    p0.copy(p);
    v.y -= 9.81 * dt;
    p.addScaledVector(v, dt);
    for (const t of targets) {
      if (p0.z !== p.z && (p0.z - t.z) * (p.z - t.z) <= 0) {
        const k = (t.z - p0.z) / (p.z - p0.z), hx = lerp(p0.x, p.x, k), hy = lerp(p0.y, p.y, k);
        const pts = testTarget(t, hx, hy);
        if (pts !== null) { onTargetHit(t, pts, hx, hy); return V3(hx, hy, t.z); }
      }
    }
    if (p.y < 0 || p.y > 3.4 || Math.abs(p.x) > 3.45 || p.z < -35.5 || p.z > 3) return p.clone();
  }
  return p.clone();
}
function onTargetHit(t, pts, hx, hy) {
  score.total += pts; score.hits++; updateBoard();
  const delay = (t.dist / 343) * 1000;                                   // звук идёт со скоростью звука
  if (t.kind === 'paper') { addHole(hx, hy, t.z); setTimeout(() => sfx.thud(), delay); }
  else { t.t = 0; setTimeout(() => sfx.ping(), delay); }
}

// ---------- Барабан ----------
function setLatch(v) {                                     // защёлка: порог 80%, только при опущенном курке
  if (gun.latched && v >= 0.8 && gun.hammer.down) { gun.latched = false; gun.unlatchT = now(); gun.swingVel = 50; sfx.latch(); gun.buzz(gun.cylHand, 0.4, 20); }
}
function driveSwing(target) { if (!gun.latched) { gun.driven = true; gun.driveTarget = clamp(target, 0, 95); } }
function spinByHand(delta) {                               // щелчок и фиксация каждые 60°
  if (!isOpen()) return;
  gun.spinAcc += delta;
  while (Math.abs(gun.spinAcc) >= 60) {
    const s = Math.sign(gun.spinAcc);
    gun.rotorBase += 60 * s; gun.rotorVis = gun.rotorBase; gun.spinAcc -= 60 * s;
    sfx.tick(); gun.buzz(gun.cylHand, 0.25, 15);
  }
}
function endSpin() { gun.spinAcc = 0; }
function ejectChamber(i, speed) {
  const c = gun.chambers[i]; if (!c) return;
  gun.chambers[i] = null;
  scene.attach(c.mesh);                                    // сохранить мировую позу
  c.where = 'free'; c.rest = false; c.slide = null; c.ch = -1; c.idle = 0;
  _ga.set(0, 0, 1).transformDirection(gun.rotor.matrixWorld);            // назад, через задний срез
  c.v.copy(_ga).multiplyScalar(speed).add(_gp3.set((Math.random() - 0.5) * 0.1, 0.05, (Math.random() - 0.5) * 0.1));
}
function ejectSpent() {                                    // толчок штока: стреляные гильзы вылетают
  let any = false;
  for (let i = 0; i < 6; i++) { const c = gun.chambers[i]; if (c && c.state === 'spent') { ejectChamber(i, 0.35); any = true; } }
  if (any) sfx.eject();
}
function pushEjector(v) {                                  // шток: порог 90%, повторно после отпускания
  if (gun.ejectArmed && v >= 0.9 && isOpen()) { gun.ejectArmed = false; ejectSpent(); gun.buzz(gun.cylHand, 0.4, 25); }
  else if (!gun.ejectArmed && v <= 0.3) gun.ejectArmed = true;
}

// Вставка патрона из руки: угол ≤ 30°, смещение ≤ 12 мм, донце дошло до среза каморы
function tryInsert(cart) {
  if (!isOpen()) return false;
  gun.root.updateMatrixWorld(true);
  const axis = chamberAxisWorld(_ga);
  const cdir = _gp2.set(0, 0, -1).applyQuaternion(cart.mesh.quaternion);
  if (cdir.angleTo(axis) > 30 * D2R) return false;
  let best = -1, bl = 1e9;
  for (let i = 0; i < 6; i++) {
    if (gun.chambers[i]) continue;
    const d = _gp.copy(cart.mesh.position).sub(chamberMouthWorld(i, _gp3));
    const depth = d.dot(axis), lat = d.addScaledVector(axis, -depth).length();
    if (lat <= 0.012 && depth >= -0.004 && depth <= 0.04 && lat < bl) { bl = lat; best = i; }
  }
  if (best < 0) return false;
  seatCart(cart, best);
  return true;
}
function seatCart(cart, i) {
  const hand = cart.hand;
  gun.chambers[i] = cart; cart.where = 'chamber'; cart.ch = i; cart.hand = null; cart.rest = false;
  gun.rotor.attach(cart.mesh);
  cart.slide = { t: 0, p0: cart.mesh.position.clone(), q0: cart.mesh.quaternion.clone() };   // 60 мс до идеальной позы
  sfx.seat(); gun.buzz(hand, 0.3, 20);
}

// ---------- Обновление механики ----------
function updateCylinder(dt) {
  const prev = gun.swingAngle;
  if (gun.driven) {
    gun.swingAngle = lerp(gun.swingAngle, gun.driveTarget, 1 - Math.exp(-30 * dt));
    if (dt > 0) gun.swingVel = (gun.swingAngle - prev) / dt;
    gun.driven = false;
  } else if (!gun.latched) {
    gun.swingAngle += gun.swingVel * dt;
    gun.swingVel *= Math.exp(-8 * dt);                     // трение шарнира
  }
  const max = gun.latched ? 0 : 95;
  if (gun.swingAngle > max) { gun.swingAngle = max; if (gun.swingVel > 0) gun.swingVel *= -0.15; }   // упор
  if (gun.swingAngle < 0) { gun.swingAngle = 0; if (gun.swingVel < 0) gun.swingVel = 0; }
  if (!gun.latched && gun.wasOpen && gun.swingAngle <= 3) {                                          // закрыли: «клац» и блокировка
    gun.latched = true; gun.swingAngle = 0; gun.swingVel = 0; gun.wasOpen = false; gun.spinAcc = 0;
    sfx.close(); gun.buzz(gun.cylHand, 0.5, 30);
  }
  if (!gun.latched && !gun.wasOpen && gun.swingAngle <= 3 && now() - gun.unlatchT > 0.6) {          // защёлку нажали, а барабан не открыли: фиксируем снова
    gun.latched = true; gun.swingAngle = 0; gun.swingVel = 0; sfx.latch();
  }
  gun.swing.rotation.z = gun.swingAngle * D2R;
  if (isOpen() && !gun.wasOpen) gun.wasOpen = true;
  gun.hammer.locked = !gun.latched || isOpen();            // курок нельзя взводить при открытом барабане

  if (gun.rotorAnim) {
    const a = gun.rotorAnim; a.t += dt / 0.04;
    const k = Math.min(1, a.t);
    gun.rotorVis = lerp(a.from, a.to, k);
    if (k >= 1) { gun.rotorBase = a.to; gun.rotorVis = a.to; gun.rotorAnim = null; }
  }
  gun.rotor.rotation.z = (gun.rotorVis + gun.spinAcc * 0.5) * D2R;
}

function updateGunFree(dt) {                               // брошенный револьвер падает на стол или пол
  const g = gun;
  if (g.holder || g.holstered) { g.idle = 0; g.rest = false; return; }
  if (!g.rest) {
    g.vel.y -= 9.81 * dt;
    g.root.position.addScaledVector(g.vel, dt);
    const sy = surfaceY(g.root.position) + 0.105;
    if (g.root.position.y <= sy && g.vel.y <= 0) {
      g.root.position.y = sy;
      if (Math.abs(g.vel.y) > 1) sfx.thud();
      g.vel.set(0, 0, 0); g.rest = true;
    }
    flatten(g.root, Math.min(1, dt * 8));
  }
  g.idle += dt;
  if (g.idle > 20) holsterGun();                           // 20 с на полу: плавно возвращается в кобуру
}

function updateGun(dt) {
  const g = gun;
  g.root.updateMatrixWorld(true);
  g.hammer.update(dt);
  if (g.strikeT >= 0) { g.strikeT -= dt; if (g.strikeT < 0) { g.strikeT = -1; strike(); } }
  updateCylinder(dt);

  g.hammerPivot.rotation.x = g.hammer.angle * D2R;         // курок назад = положительный поворот вокруг X
  g.latchPress = Math.max(0, g.latchPress - dt * 8);
  g.latchMesh.position.x = -0.014 + 0.006 * g.latchPress;

  if (g.recoilT >= 0) {                                    // отдача: 8° и 20 мм за 35 мс, возврат 220 мс
    g.recoilT += dt;
    const a = g.recoilT < 0.035 ? g.recoilT / 0.035 : 1 - THREE.MathUtils.smoothstep(g.recoilT - 0.035, 0, 0.22);
    g.recoil.rotation.x = 8 * D2R * g.recoilK * a;
    g.recoil.position.z = 0.02 * g.recoilK * a;

// ---------- Голова и кобура ----------
const head = { pos: V3(), quat: new THREE.Quaternion() };

// ---------- Виньетка: чёрное кольцо перед камерой, без постобработки ----------
const VSEG = 40;

  const n = VSEG * 3, pos = new Float32Array(n * 3), col = new Float32Array(n * 4), idx = [];

    idx.push(a, b, a1, a1, b, b1, b, c, b1, b1, c, c1);

  }

// ---------- Локомоция: недоминантный стик ходит, доминантный поворачивает ----------
const loco = { vel: V3(), turned: false, pulse: 0, fov: 110 };

}

  loco.fov += clamp(target - loco.fov, -rate * dt, rate * dt);
  setVignette(loco.fov);
}

// =====================================================================
//  Взаимодействие рук с револьвером и патронами (VR). Всё физически, без кнопок.
// =====================================================================
const SUPPORT_LOCAL = gun.supportPt.position;

function takeGun(name) {

function interactVR(dt) {
  const g = gun;

    const h = hands[name];

    // --- хват: взять револьвер или патрон ---
    const on = h.grip >= 0.7, off = h.grip < 0.4;
    const rise = on && !h.gripWas;

    if (rise && h.holding === null && !h.cylGrab && !h.supporting) {
      const gunP = g.holstered ? holster.pos : g.root.position;
      if (!g.holder && h.palm.distanceTo(gunP) < (g.holstered ? 0.14 : 0.18)) takeGun(name);

        const c = nearestFreeCart(h.palm, 0.045);

    }

// Рука с револьвером: спуск и взвод большим пальцем (стик)
function mainHand(h, dt) {

  if (h.name === MAIN) {                                   // стик доминантной руки назад = курок назад
    const pull = THREE.MathUtils.clamp((h.stickY - 0.25) / 0.7, 0, 1);

      else { g.hammer.release('thumb'); g.hamHand = null; }
    }

}

// Свободная рука: курок, защёлка, барабан, шток, патроны, опора
function supportHand(h, dt) {
  const g = gun;

  const spur = g.hammerPivot.localToWorld(_w.copy(SPUR_LOCAL));
  const d = h.tip.distanceTo(spur);
  if (g.hammer.owner === h) {
    if (h.trig < 0.3 || d > 0.12) { g.hammer.release(h); g.hamHand = null; }
    else {
      const p = g.root.worldToLocal(_w2.copy(h.tip)).sub(g.hammerPivot.position);

  // 5) шток экстрактора: коснуться кончиком головки (на открытом барабане)

}

  }
}

// Стол: если патронов мало и стол вне поля зрения, тихо досыпаем горсть
let refillT = 0;
function updateRefill(dt, phoneMode) {
  refillT -= dt; if (refillT > 0) return;
  refillT = 2;
  let live = 0;
  for (const c of carts) if (c.state === 'live' && c.where !== 'chamber') live++;
  if (live >= 8) return;
  const tablePos = V3(0, TABLE.top, (TABLE.z0 + TABLE.z1) / 2);
  const view = V3(0, 0, -1).applyQuaternion(head.quat), to = tablePos.sub(head.pos).normalize();
  const hidden = view.angleTo(to) > 60 * D2R;
  if (hidden || (phoneMode && live === 0)) spawnCarts(Math.min(6, 18 - live));
}

// =====================================================================
//  Режим телефона: те же правила механики, но вместо рук кнопки на экране.
//  Осмотреться: тянуть пальцем по экрану.
// =====================================================================
const phone = { yaw: 0, pitch: -0.3, cockHeld: false, fireHeld: false, swingTarget: null };
const phoneTilt = new THREE.Quaternion().setFromEuler(new THREE.Euler(0.06, 0.07, 0));

const hint = () => 'Тяни экран: осмотреться. Достать → Взвести (держать) → ОГОНЬ. Перезарядка: Барабан → Вытряхнуть → Патрон ×N → Барабан';
function say(t) {
  $('status').textContent = t;
  clearTimeout(say.timer);
  say.timer = setTimeout(() => { $('status').textContent = hint(); }, 3500);
}

function phoneAim(p, d) {                                  // пуля летит в точку перекрестия на 30 м
  camera.updateMatrixWorld(true);
  _w.set(0, 0, -1).transformDirection(camera.matrixWorld);
  camera.getWorldPosition(_w2).addScaledVector(_w, 30);
  d.copy(_w2).sub(p).normalize();
}

const needGun = () => { if (gun.holder !== 'phone') { say('Сначала достань револьвер'); return true; } return false; };
function phoneDraw() {
  if (gun.holder === 'phone') { holsterGun(); say('Револьвер в кобуре'); return; }
  if (gun.holder) return;
  gun.holder = 'phone'; gun.holstered = false; gun.rest = false; gun.idle = 0;
  gun.hammer.owner = null; gun.hammer.dragSpeed = 260;     // на экране взвод медленнее: кнопку надо подержать
  gun.prevInit = false; gun.shake = 0;
  sfx.rub(0.8);
}
function phoneCyl() {
  if (needGun()) return;
  if (gun.latched) {
    if (!gun.hammer.down) { say('Курок взведён: сделай выстрел, потом открывай барабан'); return; }
    setLatch(1); phone.swingTarget = 95;                   // нажали защёлку и откинули журавль
  } else phone.swingTarget = 0;                            // закрыть: «клац» на ≤ 3°
}
function phoneSpin() {
  if (needGun()) return;
  if (!isOpen()) { say('Барабан закрыт: сначала открой'); return; }
  gun.cylHand = 'phone'; spinByHand(60);
}
function phoneDump() {
  if (needGun()) return;
  if (!isOpen()) { say('Барабан закрыт: сначала открой'); return; }
  sfx.eject();
  for (let i = 0; i < 6; i++) setTimeout(() => ejectChamber(i, 0.2), i * 90);   // по одной, не горстью
}
function phoneLoad() {
  if (needGun()) return;
  if (!isOpen()) { say('Барабан закрыт: сначала открой'); return; }
  const empty = gun.chambers.indexOf(null);
  if (empty < 0) { say('Барабан полон: закрой его'); return; }
  let best = null, bd = 1e9;
  for (const c of carts) {                                 // ближайший патрон со стола
    if (c.where !== 'free' || c.state !== 'live') continue;
    const d = c.mesh.position.distanceTo(camera.position);
    if (d < bd) { bd = d; best = c; }
  }
  if (!best) { say('На столе нет патронов'); return; }
  gun.root.updateMatrixWorld(true);
  const axis = chamberAxisWorld(_w2);
  chamberMouthWorld(empty, _w).addScaledVector(axis, -0.02);
  best.mesh.position.copy(_w);
  gun.rotor.getWorldQuaternion(best.mesh.quaternion);
  best.where = 'hand'; best.hand = 'phone'; best.rest = false;
  seatCart(best, empty);
}

function updatePhone(dt) {
  camera.position.set(0, 1.6, 0);
  camera.rotation.set(phone.pitch, phone.yaw, 0, 'YXZ');
  camera.updateMatrixWorld(true);
  if (gun.holder !== 'phone') return;

  gun.root.position.copy(_w.set(0.13, -0.18, -0.32).applyMatrix4(camera.matrixWorld));   // револьвер в руке, внизу справа
  gun.root.quaternion.copy(camera.quaternion).multiply(phoneTilt);

  if (phone.cockHeld) {
    if (gun.hammer.tryHold('phone')) { gun.hamHand = 'phone'; gun.hammer.drag('phone', 52, dt); }
    if (gun.hammer.cocked) { phone.cockHeld = false; gun.hammer.release('phone'); gun.hamHand = null; }   // взвели: палец можно не убирать, ОГОНЬ сработает
  } else if (gun.hammer.owner === 'phone') { gun.hammer.release('phone'); gun.hamHand = null; }
  trigInput(phone.fireHeld ? 1 : 0, gun.hammer.cocked && !isOpen());

  if (phone.swingTarget !== null) {
    driveSwing(phone.swingTarget);
    if ((phone.swingTarget === 0 && gun.latched) || (phone.swingTarget > 0 && gun.swingAngle > 92)) phone.swingTarget = null;
  }
}

// ---------- Кнопки и взгляд ----------
function press(act, down) {
  if (act === 'cock' || act === 'fire') {
    if (act === 'cock') phone.cockHeld = down; else phone.fireHeld = down;
    if (down) needGun();
    return;
  }
  if (!down) return;
  ({ draw: phoneDraw, cyl: phoneCyl, spin: phoneSpin, dump: phoneDump, load: phoneLoad })[act]();
}
for (const b of document.querySelectorAll('#pad button')) {
  const act = b.dataset.act;
  const dn = (e) => { e.preventDefault(); sfx.init(); b.classList.add('on'); press(act, true); };
  const up = (e) => { e.preventDefault(); b.classList.remove('on'); sfx.init(); press(act, false); };   // init и тут: iOS включает звук только по отпусканию
  b.addEventListener('pointerdown', dn);
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('pointerleave', up);
}
let lookDrag = null;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', (e) => { sfx.init(); lookDrag = { id: e.pointerId, x: e.clientX, y: e.clientY }; try { cv.setPointerCapture(e.pointerId); } catch (_) {} });
cv.addEventListener('pointermove', (e) => {
  if (!lookDrag || e.pointerId !== lookDrag.id) return;
  phone.yaw -= (e.clientX - lookDrag.x) * 0.005;
  phone.pitch = clamp(phone.pitch - (e.clientY - lookDrag.y) * 0.005, -1.2, 1.2);
  lookDrag.x = e.clientX; lookDrag.y = e.clientY;
});
const endLook = () => { lookDrag = null; sfx.init(); };
cv.addEventListener('pointerup', endLook);
cv.addEventListener('pointercancel', endLook);
window.addEventListener('keydown', (e) => {                // на компьютере: Space огонь, C взвод, остальное кнопками
  if (e.repeat) return;
  if (e.code === 'Space') press('fire', true); else if (e.code === 'KeyC') press('cock', true);
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'Space') press('fire', false); else if (e.code === 'KeyC') press('cock', false);
});

// =====================================================================
//  Запуск и главный цикл
// =====================================================================
spawnCarts(18);                                            // 18 патронов россыпью на столе
for (let i = 0; i < 6; i++) {                              // револьвер заряжен: 6 боевых в камерах
  const c = makeCart('live');
  c.where = 'chamber'; c.ch = i; gun.chambers[i] = c;
  gun.rotor.add(c.mesh);
  chamberLocal(i, c.mesh.position); c.mesh.quaternion.identity();
}
updateBoard();
$('status').textContent = hint();
if (!new URLSearchParams(location.search).has('nogun')) phoneDraw();   // на телефоне сразу в руке
window.__booted = true;                                    // страница поднялась (см. проверку загрузки Three.js вверху)

let lastT = performance.now();
renderer.setAnimationLoop(() => {
  const t = performance.now();
  const dt = Math.min((t - lastT) / 1000, 0.05);
  lastT = t;

  if (inVR()) {
    readHands();
    locomotion(dt);
    dolly.updateMatrixWorld(true);
    readHead();
    poseHands(dt);
    updateHolster(dt);
    interactVR(dt);
  } else {
    updatePhone(dt);
    readHead();
    updateHolster(dt);
  }
  placeGun(dt);
  updateGun(dt);
  updateCarts(dt);
  updateTargets(dt);
  updateFx(dt);
  updateRefill(dt, !inVR());

  renderer.render(scene, camera);
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- Вход в VR ----------
(async function setupXR() {
  const btn = $('vrbtn');
  if (!navigator.xr) { say('Режим телефона: WebXR недоступен в этом браузере'); return; }
  let ok = false;
  try { ok = await navigator.xr.isSessionSupported('immersive-vr'); } catch (e) { ok = false; }
  if (!ok) { say('Режим телефона. Для VR открой эту страницу в браузере шлема (Quest Browser)'); return; }

  btn.style.display = 'block';
  btn.onclick = async () => {
    sfx.init();
    try {
      const session = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor'] });
      await renderer.xr.setSession(session);
    } catch (e) { say('Не удалось войти в VR: ' + (e && e.message ? e.message : e)); }
  };
  renderer.xr.addEventListener('sessionstart', () => {
    document.body.classList.add('vr');
    holsterGun();                                          // в VR револьвер начинает в кобуре на поясе
    gun.hammer.dragSpeed = 900;
    phone.cockHeld = false; phone.fireHeld = false; phone.swingTarget = null;
    dolly.position.set(0, 0, 0); dolly.rotation.set(0, 0, 0);
    loco.vel.set(0, 0, 0); loco.fov = 110;
  });
  renderer.xr.addEventListener('sessionend', () => {
    document.body.classList.remove('vr');
    vig.mesh.visible = false;
    dolly.position.set(0, 0, 0); dolly.rotation.set(0, 0, 0); dolly.updateMatrixWorld(true);
    camera.position.set(0, 1.6, 0);
    holsterGun();
    phoneDraw();
  });
})();
</script>
</body>
</html>
